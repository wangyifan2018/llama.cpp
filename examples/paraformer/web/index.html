<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>座舱 ASR 测试台</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111823; --panel2:#0d141d; --line:#1d2836; --line2:#2a3849;
    --fg:#e9f0f8; --muted:#8ba0b8; --dim:#5d7089;
    --accent:#38bdf8; --ok:#34d399; --bad:#f87171; --rec:#fb7185; --warn:#fbbf24;
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0a0e13;color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 20px 40px}

  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;
    border-bottom:1px solid var(--line);margin-bottom:18px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand b{font-size:16px;font-weight:650;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--dim)}
  .badges{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
  .badge.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .badge.rec i{background:var(--rec);box-shadow:0 0 8px var(--rec);animation:blink 1s infinite}
  .badge.rec{color:#ffd7de;border-color:#7f2733}
  @keyframes blink{50%{opacity:.35}}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}

  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--r);padding:16px}
  .card h2{margin:0 0 12px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}

  /* stage */
  .stage{display:flex;gap:18px;align-items:center}
  .recwrap{position:relative;flex:0 0 132px;height:132px}
  .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line2);transition:border-color .18s}
  .ring.hot{border-color:var(--rec);box-shadow:0 0 22px rgba(251,113,133,.35)}
  #btnRec{position:absolute;inset:10px;border:0;border-radius:50%;cursor:pointer;color:#03121c;
    background:linear-gradient(180deg,#7dd3fc,#38bdf8);font-weight:700;font-size:15px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 8px 22px rgba(56,189,248,.22);transition:transform .1s,filter .18s}
  #btnRec:hover{filter:brightness(1.06)}
  #btnRec:active{transform:scale(.97)}
  #btnRec.rec{background:linear-gradient(180deg,#fda4af,#fb7185);color:#2b0b12;box-shadow:0 8px 24px rgba(251,113,133,.3)}
  #btnRec .icon{font-size:26px;line-height:1}
  #btnRec small{font-size:12px;font-weight:600;opacity:.78}
  canvas#wave{width:100%;height:156px;display:block;border-radius:10px;background:#080d13;border:1px solid var(--line)}
  .meter{height:5px;margin-top:9px;border-radius:999px;background:#080d13;border:1px solid var(--line);overflow:hidden}
  .meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--accent),var(--rec));transition:width .05s linear}

  .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
  button.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);padding:8px 13px;
    border-radius:9px;cursor:pointer;font-size:13px}
  button.ghost:hover{background:#182231}
  button.ghost:disabled{opacity:.4;cursor:not-allowed}
  button.danger{color:#ffc9c9;border-color:#5a232b;background:#1d1013}
  .hint{color:var(--dim);font-size:12px}
  kbd{background:#080d13;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted)}
  label.switch{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;
    padding:6px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2)}
  label.switch input{accent-color:var(--accent)}

  /* transcript */
  .transcript{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .partial{min-height:19px;color:var(--accent);font-size:13px;opacity:.9}
  .final{font-size:19px;line-height:1.3;font-weight:600;min-height:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .final.empty{color:var(--dim);font-weight:400;font-size:14px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11px;padding:3px 9px;border-radius:999px;background:#0c1420;border:1px solid var(--line);color:var(--muted)}
  .chip.ok{color:#062e1f;background:#6ee7b7;border-color:#6ee7b7;font-weight:700}
  .chip.bad{color:#3a0d13;background:#fda4af;border-color:#fda4af;font-weight:700}

  /* metrics */
  .spk{display:flex;gap:14px;align-items:center}
  .spkAvatar{width:74px;height:74px;border-radius:50%;flex:0 0 74px;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;background:#0c1420;border:2px solid var(--line2);color:var(--dim);transition:all .2s}
  .spkAvatar.ok{border-color:#6ee7b7;color:#062e1f;background:#6ee7b7;box-shadow:0 0 18px rgba(110,231,183,.35)}
  .spkAvatar.bad{border-color:#fda4af;color:#3a0d13;background:#fda4af;box-shadow:0 0 18px rgba(253,164,175,.3)}
  .spkBody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .spkVerdict{font-size:15px;font-weight:650}
  .spkScore{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .spkBody button{margin-top:4px;align-self:flex-start}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .stat{background:#0b1219;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .stat .k{font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  .stat .v{font-size:18px;font-variant-numeric:tabular-nums;font-weight:650;margin-top:2px}
  .stat .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:3px}
  canvas#spark{width:100%;height:54px;display:block;margin-top:10px}

  /* history table */
  .history{grid-column:1 / -1}
  .histwrap{max-height:210px;overflow:auto;border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
  td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  td.text{color:var(--fg)}
  tr.cpu td.text{color:#ffd7a8}
  tbody:empty::after{content:"尚无结果";color:var(--dim)}
  .empty-row td{color:var(--dim);border:0}

  details.log{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
  details.log summary{cursor:pointer;padding:11px 15px;color:var(--muted);font-size:12.5px;list-style:none}
  details.log summary::-webkit-details-marker{display:none}
  #log{font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
    padding:0 15px 13px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);opacity:0;
    background:#1b2432;border:1px solid var(--line2);color:var(--fg);padding:10px 16px;border-radius:10px;
    font-size:13px;transition:all .2s;pointer-events:none;z-index:9;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{border-color:#7f2733;background:#2a1216}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <b>座舱 ASR 测试台</b>
      <span id="modelName">paraformer · OpenAI /v1/audio/transcriptions + /v1/realtime</span>
    </div>
    <div class="badges">
      <span class="badge" id="bConn"><i></i>未连接</span>
      <span class="badge" id="bMode"><i></i>连续断句</span>
      <span class="badge" id="bVad"><i></i>VAD ?</span>
      <span class="badge" id="bBackend"><i></i>后端 -</span>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="stage">
        <div class="recwrap">
          <div class="ring" id="ring"></div>
          <button id="btnRec"><span class="icon">●</span><small>开始</small></button>
        </div>
        <div style="flex:1;min-width:0">
          <canvas id="wave"></canvas>
          <div class="meter"><i id="level"></i></div>
        </div>
      </div>

      <div class="controls">
        <button class="ghost" id="btnStop" disabled>停止并提交</button>
        <button class="ghost danger" id="btnClear" disabled>清空</button>
        <button class="ghost" id="btnFile">WAV 回放</button>
        <input id="file" type="file" accept="audio/wav" hidden>
        <label class="switch"><input type="checkbox" id="chkVad" checked> 服务端断句</label>
        <span class="hint" id="fileHint"></span>
        <span class="hint" style="margin-left:auto"><kbd>空格</kbd> 开始/停止</span>
      </div>

      <div class="transcript">
        <div class="partial" id="partial"></div>
        <div class="final empty" id="final">等待音频…</div>
        <div class="chips">
          <span class="chip" id="chipPieces">分段 -</span>
          <span class="chip" id="chipSpk">说话人 -</span>
          <span class="chip" id="chipSent">已发 0.00 s</span>
        </div>
      </div>
    </section>

    <aside class="card">
      <h2>说话人</h2>
      <div class="spk">
        <div class="spkAvatar" id="spkAvatar">?</div>
        <div class="spkBody">
          <div class="spkVerdict" id="spkVerdict">未判定</div>
          <div class="spkScore" id="spkScore">—</div>
          <button class="ghost" id="btnEnroll">注册我的声音（3 s）</button>
          <div class="hint" id="spkEnroll">点击后对着麦克风说 3 秒</div>
        </div>
      </div>
      <h2 style="margin-top:16px">实时指标</h2>
      <div class="stats">
        <div class="stat"><div class="k">尾延迟</div><div class="v" id="mE2E">—</div></div>
        <div class="stat"><div class="k">推理</div><div class="v" id="mInfer">—</div></div>
        <div class="stat"><div class="k">排队</div><div class="v" id="mQueue">—</div></div>
        <div class="stat"><div class="k">分段</div><div class="v" id="mSegs">0</div></div>
      </div>
      <canvas id="spark"></canvas>
      <div class="hint" id="mPct">p50 / p95 —</div>
    </aside>

    <section class="card history">
      <h2>识别历史</h2>
      <div class="histwrap"><table>
        <thead><tr><th style="width:34px">#</th><th>文本</th><th style="width:86px">时长</th>
          <th style="width:92px">推理</th><th style="width:96px">后端</th></tr></thead>
        <tbody id="rows">
          <tr class="empty-row"><td colspan="5">尚无结果</td></tr>
        </tbody>
      </table></div>
    </section>
  </main>

  <details class="log">
    <summary>事件日志</summary>
    <div id="log"></div>
  </details>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const wave = $('wave'), wctx = wave.getContext('2d');
  const spark = $('spark'), sctx = spark.getContext('2d');
  const ring = $('ring'), btnRec = $('btnRec');

  let ws = null, media = null, actx = null, node = null, recording = false;
  let pending = [], sentSamples = 0, committedAt = 0, lastPartial = '';
  const rows = new Map();          // item_id -> <tr>
  const history = [];
  const trace = new Array(360).fill(0);
  let dpr = Math.min(devicePixelRatio || 1, 2);

  function fit(canvas, h) {
    const w = canvas.clientWidth || 600;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
  }
  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(t._h);
    t._h = setTimeout(() => { t.className = 'toast'; }, 2600);
  }
  function log(kind, msg) {
    const el = $('log');
    const t = new Date().toLocaleTimeString('zh-CN', {hour12: false});
    el.textContent = t + '  ' + String(kind).padEnd(9) + (msg || '') + '\n' + el.textContent;
    if (el.textContent.length > 8000) el.textContent = el.textContent.slice(0, 8000);
  }
  function setBadge(id, cls, text) {
    const b = $(id);
    b.className = 'badge ' + (cls || '');
    b.innerHTML = '<i></i>' + text;
  }

  function drawWave() {
    const w = wave.width, h = wave.height;
    wctx.clearRect(0, 0, w, h);
    wctx.strokeStyle = '#131c27';
    wctx.lineWidth = dpr;
    wctx.beginPath(); wctx.moveTo(0, h / 2); wctx.lineTo(w, h / 2); wctx.stroke();
    const g = wctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, recording ? 'rgba(251,113,133,.85)' : 'rgba(56,189,248,.65)');
    g.addColorStop(1, recording ? 'rgba(251,113,133,.08)' : 'rgba(56,189,248,.05)');
    wctx.beginPath();
    wctx.moveTo(0, h / 2);
    for (let i = 0; i < trace.length; i++) {
      wctx.lineTo((i / (trace.length - 1)) * w, h / 2 - trace[i] * (h / 2 - 6 * dpr));
    }
    wctx.lineTo(w, h / 2);
    wctx.closePath();
    wctx.fillStyle = g;
    wctx.fill();
    wctx.beginPath();
    for (let i = 0; i < trace.length; i++) {
      const x = (i / (trace.length - 1)) * w, y = h / 2 - trace[i] * (h / 2 - 6 * dpr);
      i ? wctx.lineTo(x, y) : wctx.moveTo(x, y);
    }
    wctx.strokeStyle = recording ? '#fb7185' : '#38bdf8';
    wctx.lineWidth = 1.4 * dpr;
    wctx.stroke();
  }
  function drawSpark() {
    const w = spark.width, h = spark.height;
    sctx.clearRect(0, 0, w, h);
    const vals = history.slice(-24);
    if (vals.length < 2) return;
    const max = Math.max.apply(null, vals) * 1.15, min = Math.min.apply(null, vals) * 0.85;
    const span = Math.max(1, max - min);
    sctx.beginPath();
    vals.forEach((v, i) => {
      const x = (i / (vals.length - 1)) * w;
      const y = h - ((v - min) / span) * (h - 8 * dpr) - 4 * dpr;
      i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
    });
    sctx.strokeStyle = '#38bdf8';
    sctx.lineWidth = 1.6 * dpr;
    sctx.stroke();
    sctx.lineTo(w, h); sctx.lineTo(0, h); sctx.closePath();
    sctx.fillStyle = 'rgba(56,189,248,.10)';
    sctx.fill();
  }
  function pushLevel(v) {
    trace.push(Math.max(-1, Math.min(1, v)));
    trace.shift();
    $('level').style.width = Math.min(100, Math.abs(v) * 200).toFixed(0) + '%';
    ring.classList.toggle('hot', recording && Math.abs(v) > 0.02);
  }
  function updatePct() {
    if (!history.length) { $('mPct').textContent = 'p50 / p95 —'; return; }
    const s = history.slice().sort((a, b) => a - b);
    const q = (p) => s[Math.min(s.length - 1, Math.floor((s.length - 1) * p))];
    $('mPct').textContent = 'p50 ' + q(0.5) + ' ms  ·  p95 ' + q(0.95) + ' ms  ·  n=' + s.length;
    drawSpark();
  }

  function showSpeaker(ok, score) {
    const a = $('spkAvatar');
    a.className = 'spkAvatar ' + (ok ? 'ok' : 'bad');
    a.textContent = ok ? '认' : '否';
    $('spkVerdict').textContent = ok ? '司机（放行）' : '非司机（拦截）';
    $('spkScore').textContent = '相似度 ' + score.toFixed(3) + ' · 阈值见 /v1/speaker';
  }
  function resample16(input, srcRate) {
    if (srcRate === 16000) return input;
    const ratio = srcRate / 16000;
    const out = new Int16Array(Math.max(1, Math.floor(input.length / ratio)));
    for (let i = 0; i < out.length; i++) {
      const p = i * ratio, i0 = Math.floor(p), i1 = Math.min(i0 + 1, input.length - 1);
      out[i] = input[i0] + (input[i1] - input[i0]) * (p - i0);
    }
    return out;
  }
  function wavBlob(samples, rate) {
    const n = samples.length;
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, samples[i], true);
    return new Blob([buf], {type: 'audio/wav'});
  }
  async function enrollVoice() {
    const btn = $('btnEnroll');
    const hint = $('spkEnroll');
    btn.disabled = true;
    hint.textContent = '录音中，请说一句话…';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1}});
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(1024, 1, 1);
      const chunks = [];
      proc.onaudioprocess = (ev) => {
        const f = ev.inputBuffer.getChannelData(0);
        const i16 = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) i16[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
        chunks.push(i16);
      };
      src.connect(proc); proc.connect(ctx.destination);
      await new Promise(r => setTimeout(r, 3000));
      proc.disconnect(); src.disconnect();
      stream.getTracks().forEach(t => t.stop());
      await ctx.close();
      const total = chunks.reduce((a, c) => a + c.length, 0);
      const all = new Int16Array(total);
      let off = 0;
      for (const c of chunks) { all.set(c, off); off += c.length; }
      // The server accepts 16 kHz only and rejects anything else, so resample
      // here: a browser capture is normally 44.1 or 48 kHz.
      const rate = ctx.sampleRate;
      const to16 = resample16(all, rate);
      const blob = wavBlob(to16, 16000);
      hint.textContent = '上传中…';
      const fd = new FormData();
      fd.append('file', blob, 'enroll.wav');
      const r = await fetch('/v1/speaker/enroll', {method: 'POST', body: fd});
      const j = await r.json();
      if (!r.ok) throw new Error((j.error && j.error.message) || 'enroll failed');
      hint.textContent = '已注册 ' + j.clips + ' 段，自相似度 ' + j.self_cosine.toFixed(3);
      toast('声纹已更新');
      refreshSpeaker();
    } catch (e) {
      hint.textContent = '注册失败：' + e.message;
      toast('注册失败：' + e.message, true);
    } finally {
      btn.disabled = false;
    }
  }
  async function refreshSpeaker() {
    try {
      const s = await (await fetch('/v1/speaker', {cache: 'no-store'})).json();
      if (s.enabled) {
        $('spkScore').textContent = '注册 ' + (s.clips > 0 ? s.clips + ' 段' : '（文件）') +
          ' · 自相似 ' + (s.self_cosine || 0).toFixed(3) + ' · 阈值 ' + s.threshold.toFixed(2);
      } else {
        $('spkVerdict').textContent = '未启用';
      }
    } catch (e) {}
  }

  function newRow(item) {
    const tbody = $('rows');
    const empty = tbody.querySelector('.empty-row');
    if (empty) empty.remove();
    const n = tbody.children.length + 1;
    const tr = document.createElement('tr');
    tr.dataset.item = item || '';
    tr.innerHTML = '<td class="num">' + n + '</td><td class="text"></td>' +
                   '<td class="num dur">—</td><td class="num inf">—</td><td class="num bk">—</td>';
    tbody.appendChild(tr);
    const wrap = document.querySelector('.histwrap');
    if (wrap) wrap.scrollTop = wrap.scrollHeight;
    if (item) rows.set(item, tr);
    return tr;
  }

  /* ---- protocol ---- */
  function applyTurnDetection() {
    const on = $('chkVad').checked;
    setBadge('bMode', on ? 'on' : '', on ? '连续断句' : '单击模式');
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({type: 'session.update', session: {
      turn_detection: on
        ? {type: 'server_vad', silence_duration_ms: 300, min_speech_duration_ms: 200, threshold: 0.5}
        : {type: 'none'}}}));
    log('session', on ? 'server_vad on' : 'server_vad off');
  }
  function connect() {
    if (ws && ws.readyState <= 1) return Promise.resolve();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = proto + '//' + location.host + '/v1/realtime';
    return new Promise((resolve, reject) => {
      ws = new WebSocket(url);
      ws.onopen = () => { setBadge('bConn', 'on', '已连接'); log('ws', 'open'); applyTurnDetection(); resolve(); };
      ws.onerror = () => { setBadge('bConn', '', '连接失败'); toast('WebSocket 连接失败', true); reject(new Error('ws')); };
      ws.onclose = () => { setBadge('bConn', '', '未连接'); log('ws', 'closed'); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        const t = m.type || '';
        if (t === 'x.pf.partial') {
          lastPartial = m.text || '';
          $('partial').textContent = lastPartial;
        } else if (t.endsWith('delta')) {
          lastPartial += m.delta;
          $('partial').textContent = lastPartial;
        } else if (t === 'x.pf.metrics') {
          const tr = rows.get(m.item_id);
          if (tr) {
            if (typeof m.infer_ms === 'number') tr.querySelector('.inf').textContent = Math.round(m.infer_ms) + ' ms';
            if (typeof m.queue_ms === 'number' && m.queue_ms > 1) tr.title = '排队 ' + Math.round(m.queue_ms) + ' ms';
            if (m.backend) {
              tr.querySelector('.bk').textContent = m.backend;
              tr.classList.toggle('cpu', String(m.backend).indexOf('HTP') !== 0);
              const b = $('bBackend');
              b.className = 'badge ' + (String(m.backend).indexOf('HTP') === 0 ? 'on' : '');
              b.innerHTML = '<i></i>后端 ' + m.backend;
            }
          }
          if (typeof m.infer_ms === 'number') $('mInfer').innerHTML = Math.round(m.infer_ms) + '<small>ms</small>';
          if (typeof m.tail_ms === 'number') {
            const tail = Math.round(m.tail_ms);
            $('mE2E').innerHTML = tail + '<small>ms</small>';
            history.push(tail); updatePct();
          }
          if (typeof m.queue_ms === 'number') $('mQueue').innerHTML = Math.round(m.queue_ms) + '<small>ms</small>';
        } else if (t.endsWith('completed')) {
          const ms = committedAt ? Math.round(performance.now() - committedAt) : 0;
          committedAt = 0;
          const text = m.transcript || '';
          $('final').textContent = text || '(空)';
          $('final').classList.toggle('empty', !text);
          const tr = newRow(m.item_id);
          tr.querySelector('.text').textContent = text || '(空)';
          const dur = (m.usage && m.usage.seconds) ? m.usage.seconds.toFixed(1) + ' s' : '—';
          tr.querySelector('.dur').textContent = dur;
          $('mSegs').textContent = $('rows').children.length;
          if (typeof m.speaker_score === 'number') {
            const ok = !!m.speaker_ok;
            const c = $('chipSpk');
            c.className = 'chip ' + (ok ? 'ok' : 'bad');
            c.textContent = (ok ? '司机' : '非司机') + ' ' + m.speaker_score.toFixed(3);
            showSpeaker(ok, m.speaker_score);
          } else if (m.speaker_status && m.speaker_status !== 'assessed') {
            $('spkVerdict').textContent = '未判定（' + m.speaker_status + '）';
            $('spkScore').textContent = '—';
            $('spkAvatar').className = 'spkAvatar';
            $('spkAvatar').textContent = '?';
          }
          if (ms && !$('chkVad').checked) { history.push(ms); $('mE2E').innerHTML = ms + '<small>ms</small>'; updatePct(); }
          if (!$('chkVad').checked) { $('partial').textContent = ''; lastPartial = ''; }
          log('done', (text || '(空)').slice(0, 40));
        } else if (t === 'error') {
          log('error', JSON.stringify(m.error || m));
          toast('服务端错误:' + ((m.error && m.error.message) || 'unknown'), true);
        } else if (t === 'session.updated') {
          const td = (m.session && m.session.turn_detection) || {};
          log('session', 'turn_detection=' + (td.type || 'none'));
        } else if (t.endsWith('committed')) {
          log('commit', m.item_id || '');
        }
      };
    });
  }

  function sendChunk(i16) {
    if (!ws || ws.readyState !== 1) return;
    const bytes = new Uint8Array(i16.buffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    ws.send(JSON.stringify({type: 'input_audio_buffer.append', audio: btoa(bin)}));
    sentSamples += i16.length;
    $('chipSent').textContent = '已发 ' + (sentSamples / 16000).toFixed(2) + ' s';
  }
  function feed(samples, srcRate) {
    if (srcRate !== 16000) {
      const ratio = srcRate / 16000;
      const out = new Int16Array(Math.max(1, Math.floor(samples.length / ratio)));
      for (let i = 0; i < out.length; i++) {
        const p = i * ratio, i0 = Math.floor(p), i1 = Math.min(i0 + 1, samples.length - 1);
        out[i] = samples[i0] + (samples[i1] - samples[i0]) * (p - i0);
      }
      samples = out;
    }
    for (let i = 0; i < samples.length; i++) pending.push(samples[i]);
    while (pending.length >= 320) {
      const chunk = Int16Array.from(pending.slice(0, 320));
      pending = pending.slice(320);
      let acc = 0;
      for (let i = 0; i < chunk.length; i++) acc += chunk[i] * chunk[i];
      pushLevel(Math.sqrt(acc / chunk.length) / 32768 * 3);
      sendChunk(chunk);
    }
    drawWave();
  }

  async function start() {
    if (recording) return;
    try {
      await connect();
      media = await navigator.mediaDevices.getUserMedia({
        audio: {channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    } catch (e) { toast('无法打开麦克风:' + e.message, true); return; }
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(media);
    node = actx.createScriptProcessor(1024, 1, 1);
    node.onaudioprocess = (ev) => {
      if (!recording) return;
      const f = ev.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f.length);
      for (let i = 0; i < f.length; i++) i16[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
      feed(i16, actx.sampleRate);
    };
    src.connect(node); node.connect(actx.destination);
    recording = true;
    btnRec.classList.add('rec');
    btnRec.innerHTML = '<span class="icon">■</span><small>停止</small>';
    $('btnStop').disabled = false; $('btnClear').disabled = false;
    setBadge('bConn', 'rec', '录音中');
    $('final').textContent = ''; $('final').classList.add('empty');
    log('mic', 'source ' + actx.sampleRate + ' Hz');
  }
  async function stop() {
    if (!recording) return;
    recording = false;
    btnRec.classList.remove('rec');
    btnRec.innerHTML = '<span class="icon">●</span><small>开始</small>';
    $('btnStop').disabled = true;
    if (node) { node.disconnect(); node = null; }
    if (media) { media.getTracks().forEach(t => t.stop()); media = null; }
    if (actx) { await actx.close(); actx = null; }
    if (pending.length) { feed(new Int16Array(pending), 16000); pending = []; }
    if (ws && ws.readyState === 1) {
      committedAt = performance.now();
      ws.send(JSON.stringify({type: 'input_audio_buffer.commit'}));
      setBadge('bConn', 'on', '等待结果');
      log('commit', (sentSamples / 16000).toFixed(2) + ' s');
    }
  }
  function clearAll() {
    recording = false;
    pending = []; sentSamples = 0; lastPartial = ''; committedAt = 0;
    history.length = 0; rows.clear();
    $('rows').innerHTML = '<tr class="empty-row"><td colspan="5">尚无结果</td></tr>';
    $('chipSent').textContent = '已发 0.00 s';
    $('final').textContent = '等待音频…'; $('final').classList.add('empty');
    $('partial').textContent = '';
    $('mSegs').textContent = '0';
    $('mE2E').textContent = '—'; $('mQueue').textContent = '—'; $('mInfer').textContent = '—';
    $('chipSpk').className = 'chip'; $('chipSpk').textContent = '说话人 -';
    updatePct();
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: 'input_audio_buffer.clear'}));
    log('clear', '');
  }
  async function playFile(file) {
    await connect();
    const buf = await file.arrayBuffer();
    const ctx = new AudioContext();
    const audio = await ctx.decodeAudioData(buf);
    const ch = audio.getChannelData(0);
    const i16 = new Int16Array(ch.length);
    for (let i = 0; i < ch.length; i++) i16[i] = Math.max(-1, Math.min(1, ch[i])) * 32767;
    $('fileHint').textContent = file.name + ' · ' + (audio.length / audio.sampleRate).toFixed(2) + ' s';
    recording = true;
    btnRec.classList.add('rec');
    setBadge('bConn', 'rec', '回放中');
    log('file', file.name);
    let i = 0;
    const tick = () => {
      if (!recording) return;
      if (i >= i16.length) {
        recording = false;
        btnRec.classList.remove('rec');
        if (pending.length) { feed(new Int16Array(pending), 16000); pending = []; }
        committedAt = performance.now();
        ws.send(JSON.stringify({type: 'input_audio_buffer.commit'}));
        setBadge('bConn', 'on', '等待结果');
        return;
      }
      const n = Math.min(i16.length - i, Math.floor(320 * (audio.sampleRate / 16000)));
      feed(i16.slice(i, i + n), audio.sampleRate);
      i += n;
      setTimeout(tick, 20);
    };
    tick();
  }

  btnRec.onclick = () => (recording ? stop() : start());
  $('btnStop').onclick = () => stop();
  $('btnClear').onclick = () => clearAll();
  $('btnFile').onclick = () => $('file').click();
  $('file').onchange = (e) => { if (e.target.files[0]) playFile(e.target.files[0]); };
  $('chkVad').onchange = () => applyTurnDetection();
  $('btnEnroll').onclick = () => enrollVoice();
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      recording ? stop() : start();
    }
  });
  addEventListener('resize', () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    fit(wave, 156); fit(spark, 54); drawWave(); drawSpark();
  });

  fit(wave, 156); fit(spark, 54);
  drawWave(); updatePct(); applyTurnDetection(); refreshSpeaker();
  fetch('/health', {cache: 'no-store'}).then(r => r.json()).then(h => {
    $('modelName').textContent = (h.model || 'paraformer') + ' · HTP ' + (h.htp_engines || 0) + '/' + (h.engines || 0) +
      ' · VAD ' + (h.server_vad ? '开' : '关');
    setBadge('bVad', h.server_vad ? 'on' : '', 'VAD ' + (h.server_vad ? '开' : '关'));
    log('health', JSON.stringify(h).slice(0, 160));
  }).catch(() => {});
})();
</script>
