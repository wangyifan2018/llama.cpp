<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Without this the browser requests /favicon.ico, the mount point has no such
     file, and every page load leaves a 404 in the console that looks like a
     broken asset. An inline empty icon keeps the log clean. -->
<link rel="icon" href="data:,">
<title>座舱 ASR 测试台</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel-2:#0f1520; --line:#1e2733; --line-2:#2a3646;
    --fg:#e8eef6; --muted:#8ba0b8; --dim:#5d7089;
    --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --rec:#fb7185;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 600px at 20% -10%,#12202e 0%,var(--bg) 55%) fixed;
    color:var(--fg); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 56px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  h1 span{color:var(--dim);font-weight:400;margin-left:8px;font-size:13px}
  .badges{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
         background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
  .badge.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .badge.rec i{background:var(--rec);box-shadow:0 0 8px var(--rec);animation:blink 1s infinite}
  .badge.rec{color:#ffd7de;border-color:#7f2733}
  @keyframes blink{50%{opacity:.35}}

  .grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}

  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
        border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}

  .stage{position:relative;display:flex;gap:18px;align-items:center}
  .recwrap{position:relative;flex:0 0 104px;height:104px}
  .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line-2);transition:border-color .2s}
  .ring.hot{border-color:var(--rec);box-shadow:0 0 24px rgba(251,113,133,.35)}
  #btnRec{
    position:absolute;inset:9px;border-radius:50%;border:0;cursor:pointer;color:#03121c;
    background:linear-gradient(180deg,#7dd3fc,#38bdf8);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;
    box-shadow:0 8px 24px rgba(56,189,248,.25); transition:transform .12s, filter .2s;
  }
  #btnRec:hover{filter:brightness(1.06)}
  #btnRec:active{transform:scale(.97)}
  #btnRec.rec{background:linear-gradient(180deg,#fda4af,#fb7185);color:#2b0b12;box-shadow:0 8px 26px rgba(251,113,133,.32)}
  #btnRec .icon{font-size:20px;line-height:1}
  #btnRec small{font-size:10px;font-weight:600;opacity:.75;letter-spacing:.04em}

  canvas#wave{width:100%;height:132px;display:block;border-radius:10px;background:
    linear-gradient(180deg,#0a1017,#0c131c);border:1px solid var(--line)}

  .meter{height:6px;border-radius:999px;background:#0a1017;border:1px solid var(--line);overflow:hidden;margin-top:10px}
  .meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--accent),var(--rec));
           transition:width .05s linear}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  button.ghost{background:var(--panel-2);color:var(--fg);border:1px solid var(--line-2);padding:9px 14px;
               border-radius:10px;cursor:pointer;font-size:13px}
  button.ghost:hover{background:#182231}
  button.ghost:disabled{opacity:.4;cursor:not-allowed}
  button.danger{color:#ffc9c9;border-color:#5a232b;background:#1d1013}
  .hint{color:var(--dim);font-size:12px}
  kbd{background:#0a1017;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted)}

  .result{margin-top:16px}
  .final{font-size:24px;line-height:1.35;min-height:34px;font-weight:600;letter-spacing:.2px}
  .final.empty{color:var(--dim);font-weight:400;font-size:15px}
  .partial{min-height:22px;color:var(--accent);opacity:.9;font-size:15px}
  .meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:11px;padding:3px 9px;border-radius:999px;background:#0d1620;border:1px solid var(--line);color:var(--muted)}
  .chip.spk-ok{color:#062e1f;background:#6ee7b7;border-color:#6ee7b7;font-weight:700}
  .chip.spk-bad{color:#3a0d13;background:#fda4af;border-color:#fda4af;font-weight:700}
  .chip.spk-none{opacity:.6}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#0c1219;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  .stat .v{font-size:19px;font-variant-numeric:tabular-nums;font-weight:650;margin-top:2px}
  .stat .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:3px}
  canvas#spark{width:100%;height:56px;display:block;margin-top:10px}

  #log{font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
       max-height:150px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  #log:empty::before{content:"等待事件...";color:var(--dim)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;
         background:#1b2432;border:1px solid var(--line-2);color:var(--fg);padding:10px 16px;border-radius:10px;
         font-size:13px;transition:all .22s;pointer-events:none;z-index:9;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{border-color:#7f2733;background:#2a1216}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>座舱 ASR 测试台<span id="modelName">paraformer</span></h1>
    <div class="badges">
      <span class="badge" id="bConn"><i></i>未连接</span>
      <span class="badge" id="bVad"><i></i>VAD ?</span>
      <span class="badge" id="bGate"><i></i>声纹 ?</span>
      <span class="badge" id="bPartial"><i></i>预览 ?</span>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <div class="stage">
          <div class="recwrap">
            <div class="ring" id="ring"></div>
            <button id="btnRec"><span class="icon">●</span><small>开始</small></button>
          </div>
          <div style="flex:1;min-width:0">
            <canvas id="wave"></canvas>
            <div class="meter"><i id="level"></i></div>
          </div>
        </div>
        <div class="row">
          <button class="ghost" id="btnStop" disabled>停止并提交</button>
          <button class="ghost danger" id="btnClear" disabled>清空</button>
          <label class="hint" style="display:flex;gap:6px;align-items:center;cursor:pointer">
            <input type="checkbox" id="chkVad"> 连续断句（服务端 VAD）
          </label>
          <button class="ghost" id="btnFile">WAV 回放</button>
          <input id="file" type="file" accept="audio/wav" hidden>
          <span class="hint" id="fileHint"></span>
          <span class="hint" style="margin-left:auto"><kbd>空格</kbd> 开始/停止</span>
        </div>

        <div class="result">
          <div class="final empty" id="final">等待音频...</div>
          <div class="partial" id="partial"></div>
          <ol id="segments" style="margin:10px 0 0;padding-left:20px;color:#cfe3f7"></ol>
          <div class="meta">
            <span class="chip" id="chipPieces">分段 -</span>
            <span class="chip spk-none" id="chipSpk">说话人 -</span>
            <span class="chip" id="chipSent">已发 0.00 s</span>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>实时指标</h2>
        <div class="stats">
          <div class="stat"><div class="k">endpoint → final</div><div class="v" id="mE2E">—</div></div>
          <div class="stat"><div class="k">服务端队列</div><div class="v" id="mQueue">—</div></div>
          <div class="stat"><div class="k">推理耗时</div><div class="v" id="mInfer">—</div></div>
          <div class="stat"><div class="k">分段</div><div class="v" id="mSegs">0</div></div>
        </div>
        <canvas id="spark"></canvas>
        <div class="hint" id="mPct">p50 / p95 —</div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>事件</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const wave = $('wave'), wctx = wave.getContext('2d');
  const spark = $('spark'), sctx = spark.getContext('2d');
  const ring = $('ring'), btnRec = $('btnRec');

  let ws = null, media = null, actx = null, node = null, recording = false;
  let pending = [], sentSamples = 0, committedAt = 0, segments = 0, lastPartial = '';
  // Rolling level history. Starts empty rather than pre-filled with zeros: a
// 2 s clip only produces about 100 levels, so 360 pre-filled zeros pushed the
// real waveform into the rightmost sliver of the canvas and made it look like
// the audio had been clipped.
  const trace = [];
  const TRACE_MAX = 360;
  const history = [];
  let dpr = Math.min(devicePixelRatio || 1, 2);

  function fit(canvas, h) {
    const w = canvas.clientWidth || 600;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
  }

  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(t._h);
    t._h = setTimeout(() => { t.className = 'toast'; }, 2600);
  }

  function log(kind, msg) {
    const el = $('log');
    const t = new Date().toLocaleTimeString('zh-CN', {hour12: false});
    el.textContent = t + '  ' + kind.padEnd(10) + (msg || '') + '\n' + el.textContent;
    if (el.textContent.length > 8000) el.textContent = el.textContent.slice(0, 8000);
  }

  function drawWave() {
    const w = wave.width, h = wave.height;
    wctx.clearRect(0, 0, w, h);
    // centre line
    wctx.strokeStyle = '#18222f';
    wctx.lineWidth = 1 * dpr;
    wctx.beginPath(); wctx.moveTo(0, h / 2); wctx.lineTo(w, h / 2); wctx.stroke();
    if (!trace.length) return;
    // When the clip is shorter than the window, draw it across the full width
    // instead of leaving the left side blank.
    const n = trace.length;
    const g = wctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, recording ? 'rgba(251,113,133,.85)' : 'rgba(56,189,248,.7)');
    g.addColorStop(1, recording ? 'rgba(251,113,133,.10)' : 'rgba(56,189,248,.06)');
    wctx.beginPath();
    wctx.moveTo(0, h / 2);
    for (let i = 0; i < n; i++) {
      const x = (i / Math.max(1, n - 1)) * w;
      wctx.lineTo(x, h / 2 - trace[i] * (h / 2 - 6 * dpr));
    }
    wctx.lineTo(w, h / 2);
    wctx.closePath();
    wctx.fillStyle = g;
    wctx.fill();
    wctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = (i / Math.max(1, n - 1)) * w;
      const y = h / 2 - trace[i] * (h / 2 - 6 * dpr);
      i ? wctx.lineTo(x, y) : wctx.moveTo(x, y);
    }
    wctx.strokeStyle = recording ? '#fb7185' : '#38bdf8';
    wctx.lineWidth = 1.4 * dpr;
    wctx.stroke();
  }

  function drawSpark() {
    const w = spark.width, h = spark.height;
    sctx.clearRect(0, 0, w, h);
    const vals = history.slice(-20);
    if (vals.length < 2) return;
    const max = Math.max(...vals) * 1.15, min = Math.min(...vals) * 0.85;
    const span = Math.max(1, max - min);
    sctx.beginPath();
    vals.forEach((v, i) => {
      const x = (i / (vals.length - 1)) * w;
      const y = h - ((v - min) / span) * (h - 8 * dpr) - 4 * dpr;
      i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
    });
    sctx.strokeStyle = '#38bdf8';
    sctx.lineWidth = 1.6 * dpr;
    sctx.stroke();
    sctx.lineTo(w, h); sctx.lineTo(0, h); sctx.closePath();
    sctx.fillStyle = 'rgba(56,189,248,.10)';
    sctx.fill();
  }

  function setBadge(id, cls, text) {
    const b = $(id);
    b.className = 'badge ' + (cls || '');
    b.innerHTML = '<i></i>' + text;
  }

  // There is no "idle" event, so the connection badge has to be put back
  // explicitly once a segment resolves. Without this it stays on 等待结果
  // forever after the first commit, which reads as "the server never answered"
  // even though the transcript arrived.
  function settleConn() {
    if (recording) return;
    if (ws && ws.readyState === 1) setBadge('bConn', 'on', '已连接');
  }

  // Map the server's speaker_status values onto Chinese. They are distinct
  // outcomes -- `disabled` means the gate is off on purpose, `not_assessed`
  // means it was on but skipped this clip -- and printing the raw enum in a
  // Chinese UI looked like a bug in both cases.
  const SPK_STATUS = {
    disabled: '未启用', not_assessed: '未评分', in_progress: '评分中',
    silence: '静音', busy: '忙碌', ok: '已评分', mismatch: '非司机'
  };

  function pushLevel(v) {
    trace.push(Math.max(-1, Math.min(1, v)));
    while (trace.length > TRACE_MAX) trace.shift();
    $('level').style.width = Math.min(100, Math.abs(v) * 200).toFixed(0) + '%';
    ring.classList.toggle('hot', recording && Math.abs(v) > 0.02);
  }

  function updatePct() {
    if (!history.length) { $('mPct').textContent = 'p50 / p95 —'; return; }
    const s = history.slice().sort((a, b) => a - b);
    const q = (p) => s[Math.min(s.length - 1, Math.floor((s.length - 1) * p))];
    $('mPct').textContent = 'p50 ' + q(0.5) + ' ms  ·  p95 ' + q(0.95) + ' ms  ·  n=' + s.length;
    drawSpark();
  }

  async function health() {
    try {
      const r = await fetch('/health', {cache: 'no-store'});
      const h = await r.json();
      $('modelName').textContent = h.model || 'paraformer';
      setBadge('bVad', h.server_vad ? 'on' : '', 'VAD ' + (h.server_vad ? '开' : '关'));
      setBadge('bGate', h.speaker_gate ? 'on' : '', '声纹 ' + (h.speaker_gate ? '开' : '关'));
      setBadge('bPartial', h.partials ? 'on' : '', '预览 ' + (h.partials ? '开' : '关'));
      if (typeof h.queue === 'number') $('mQueue').innerHTML = h.queue + '<small>条</small>';
      log('health', JSON.stringify(h));
    } catch (e) { log('health', 'fail ' + e.message); }
  }

  function connect() {
    if (ws && ws.readyState <= 1) return Promise.resolve();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = proto + '//' + location.host + '/v1/realtime';
    return new Promise((resolve, reject) => {
      ws = new WebSocket(url);
      ws.onopen = () => {
        setBadge('bConn', 'on', '已连接');
        log('ws', 'open');
        if ($('chkVad').checked) {
          ws.send(JSON.stringify({type: 'session.update', session: {
            turn_detection: {type: 'server_vad', silence_duration_ms: 500, min_speech_duration_ms: 200, threshold: 0.5}}}));
        }
        resolve();
      };
      ws.onerror = () => { setBadge('bConn', '', '连接失败'); toast('WebSocket 连接失败', true); reject(new Error('ws')); };
      ws.onclose = () => { setBadge('bConn', '', '未连接'); log('ws', 'closed'); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        const t = m.type || '';
        if (t === 'x.pf.partial') {
          lastPartial = m.text || '';
          $('partial').textContent = lastPartial;
        } else if (t.endsWith('delta')) {
          lastPartial += m.delta;
          $('partial').textContent = lastPartial;
        } else if (t.endsWith('completed')) {
          const ms = committedAt ? Math.round(performance.now() - committedAt) : 0;
          committedAt = 0;
          const text = m.transcript || '';
          if ($('chkVad').checked) {
            const li = document.createElement('li');
            li.textContent = text || '(空)';
            li.style.marginBottom = '4px';
            $('segments').appendChild(li);
            $('mSegs').textContent = $('segments').children.length;
            $('final').textContent = text || '(空)';
          } else {
            $('final').textContent = text || '(空)';
          }
          $('final').classList.toggle('empty', !text);
          $('partial').textContent = '';
          lastPartial = '';
          segments += 1;
          $('mSegs').textContent = segments;
          if (ms) { history.push(ms); $('mE2E').innerHTML = ms + '<small>ms</small>'; updatePct(); }
          const spk = m.speaker_score;
          const status = m.speaker_status;
          if (typeof spk === 'number') {
            const ok = !!m.speaker_ok;
            const el = $('chipSpk');
            el.className = 'chip ' + (ok ? 'spk-ok' : 'spk-bad');
            el.textContent = (ok ? '司机' : '非司机') + ' ' + spk.toFixed(3);
          } else {
            $('chipSpk').className = 'chip spk-none';
            // `disabled`, `not_assessed`, `in_progress`, `silence`, `busy` are
            // different outcomes and the console used to collapse them into
            // "未评分", which reads like a bug on a service that has the gate
            // switched off on purpose.
            $('chipSpk').textContent = '说话人 ' + (SPK_STATUS[status] || status || '未评分');
          }
          settleConn();
          if (typeof m.vad_pieces === 'number') {
            $('chipPieces').textContent = '分段 ' + m.vad_pieces;
          }
          log('completed', ms + ' ms · ' + (text || '(空)'));
        } else if (t === 'x.pf.metrics') {
          // The server sends queue_ms, infer_ms, vad_ms and backend here. It
          // does not send speaker_score -- that arrives on the completed event
          // -- and this branch used to read it anyway, so the speaker chip was
          // only ever updated by whichever event happened to land first.
          if (typeof m.queue_ms === 'number') $('mQueue').innerHTML = Math.round(m.queue_ms) + '<small>ms</small>';
          if (typeof m.infer_ms === 'number') $('mInfer').innerHTML = Math.round(m.infer_ms) + '<small>ms</small>';
          if (typeof m.vad_ms === 'number' && m.vad_ms > 0) log('vad', Math.round(m.vad_ms) + ' ms');
          if (m.backend) log('backend', m.backend);
        } else if (t === 'error') {
          log('error', JSON.stringify(m.error || m));
          toast('服务端错误：' + ((m.error && m.error.message) || 'unknown'), true);
        } else if (t.endsWith('committed')) {
          log('commit', m.item_id || '');
        } else {
          log(t, '');
        }
      };
    });
  }

  function sendChunk(i16) {
    if (!ws || ws.readyState !== 1) return;
    const bytes = new Uint8Array(i16.buffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    ws.send(JSON.stringify({type: 'input_audio_buffer.append', audio: btoa(bin)}));
    sentSamples += i16.length;
    $('chipSent').textContent = '已发 ' + (sentSamples / 16000).toFixed(2) + ' s';
  }

  function feed(samples, srcRate) {
    // Resample only when the caller hands over a whole buffer. Per-chunk
    // resampling restarts the interpolation at every 20 ms boundary, which
    // puts a discontinuity into the audio the model is scoring; a WAV played
    // back at 48 kHz then decodes worse than the same file sent at 16 kHz.
    // playFile() resamples once up front, so srcRate is 16000 by the time it
    // gets here.
    if (srcRate !== 16000) {
      const ratio = srcRate / 16000;
      const out = new Int16Array(Math.max(1, Math.floor(samples.length / ratio)));
      for (let i = 0; i < out.length; i++) {
        const p = i * ratio, i0 = Math.floor(p), i1 = Math.min(i0 + 1, samples.length - 1);
        out[i] = samples[i0] + (samples[i1] - samples[i0]) * (p - i0);
      }
      samples = out;
    }
    for (let i = 0; i < samples.length; i++) pending.push(samples[i]);
    while (pending.length >= 320) {
      const chunk = Int16Array.from(pending.slice(0, 320));
      pending = pending.slice(320);
      let acc = 0;
      for (let i = 0; i < chunk.length; i++) acc += chunk[i] * chunk[i];
      pushLevel(Math.sqrt(acc / chunk.length) / 32768 * 3);
      sendChunk(chunk);
    }
    drawWave();
  }

  async function start() {
    if (recording) return;
    try {
      await connect();
      media = await navigator.mediaDevices.getUserMedia({
        audio: {channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false}
      });
    } catch (e) { toast('无法打开麦克风：' + e.message, true); return; }
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(media);
    node = actx.createScriptProcessor(1024, 1, 1);
    node.onaudioprocess = (ev) => {
      if (!recording) return;
      const f = ev.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f.length);
      for (let i = 0; i < f.length; i++) i16[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
      feed(i16, actx.sampleRate);
    };
    src.connect(node); node.connect(actx.destination);
    recording = true;
    btnRec.classList.add('rec');
    btnRec.innerHTML = '<span class="icon">■</span><small>停止</small>';
    $('btnStop').disabled = false; $('btnClear').disabled = false;
    setBadge('bConn', 'rec', '录音中');
    $('final').textContent = ''; $('final').classList.add('empty');
    log('mic', 'source ' + actx.sampleRate + ' Hz');
  }

  async function stop() {
    if (!recording) return;
    recording = false;
    btnRec.classList.remove('rec');
    btnRec.innerHTML = '<span class="icon">●</span><small>开始</small>';
    $('btnStop').disabled = true;
    if (node) { node.disconnect(); node = null; }
    if (media) { media.getTracks().forEach(t => t.stop()); media = null; }
    if (actx) { await actx.close(); actx = null; }
    if (pending.length) { feed(new Int16Array(pending), 16000); pending = []; }
    if (ws && ws.readyState === 1) {
      committedAt = performance.now();
      ws.send(JSON.stringify({type: 'input_audio_buffer.commit'}));
      setBadge('bConn', 'on', '等待结果');
      log('commit', (sentSamples / 16000).toFixed(2) + ' s');
    }
  }

  function clearAll() {
    recording = false;
    pending = []; sentSamples = 0; lastPartial = ''; segments = 0; committedAt = 0;
    history.length = 0;
    trace.length = 0;
    btnRec.classList.remove('rec');
    btnRec.innerHTML = '<span class="icon">●</span><small>开始</small>';
    // Clear is reachable while a clip is playing back, so it has to undo the
    // record-path state too, not only the counters.
    $('btnStop').disabled = true;
    $('btnFile').disabled = false;
    if (node) { node.disconnect(); node = null; }
    if (media) { media.getTracks().forEach(t => t.stop()); media = null; }
    if (actx) { actx.close(); actx = null; }
    $('chipSent').textContent = '已发 0.00 s';
    $('final').textContent = '等待音频...'; $('final').classList.add('empty');
    $('partial').textContent = '';
    $('mSegs').textContent = '0';
    $('segments').innerHTML = '';
    $('mE2E').textContent = '—'; $('mQueue').textContent = '—'; $('mInfer').textContent = '—';
    $('chipSpk').className = 'chip spk-none'; $('chipSpk').textContent = '说话人 -';
    $('chipPieces').textContent = '分段 -';
    $('fileHint').textContent = '';
    updatePct();
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({type: 'input_audio_buffer.clear'}));
      setBadge('bConn', 'on', '已连接');
    }
    log('clear', '');
  }

  async function playFile(file) {
    if (recording) return;
    await connect();
    const buf = await file.arrayBuffer();
    const ctx = new AudioContext();
    const audio = await ctx.decodeAudioData(buf);
    const ch = audio.getChannelData(0);
    // Resample once here rather than per 20 ms chunk inside feed().
    let pcm;
    if (audio.sampleRate === 16000) {
      pcm = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++) pcm[i] = Math.max(-1, Math.min(1, ch[i])) * 32767;
    } else {
      const ratio = audio.sampleRate / 16000;
      const n = Math.max(1, Math.floor(ch.length / ratio));
      pcm = new Int16Array(n);
      for (let i = 0; i < n; i++) {
        const p = i * ratio, i0 = Math.floor(p), i1 = Math.min(i0 + 1, ch.length - 1);
        const v = ch[i0] + (ch[i1] - ch[i0]) * (p - i0);
        pcm[i] = Math.max(-1, Math.min(1, v)) * 32767;
      }
    }
    await ctx.close();
    $('fileHint').textContent = file.name + ' · ' + (pcm.length / 16000).toFixed(2) + ' s';
    $('btnFile').disabled = true;
    $('btnStop').disabled = false;
    $('btnClear').disabled = false;
    $('final').textContent = ''; $('final').classList.add('empty');
    $('partial').textContent = ''; lastPartial = '';
    recording = true;
    btnRec.classList.add('rec');
    btnRec.innerHTML = '<span class="icon">■</span><small>停止</small>';
    setBadge('bConn', 'rec', '回放中');
    log('file', file.name + ' ' + audio.sampleRate + ' Hz -> 16000');
    let i = 0;
    const tick = () => {
      if (!recording) { $('btnFile').disabled = false; return; }
      if (i >= pcm.length) {
        recording = false;
        btnRec.classList.remove('rec');
        btnRec.innerHTML = '<span class="icon">●</span><small>开始</small>';
        $('btnStop').disabled = true; $('btnFile').disabled = false;
        if (pending.length) { feed(new Int16Array(pending), 16000); pending = []; }
        committedAt = performance.now();
        ws.send(JSON.stringify({type: 'input_audio_buffer.commit'}));
        setBadge('bConn', 'on', '等待结果');
        log('commit', (sentSamples / 16000).toFixed(2) + ' s');
        return;
      }
      const n = Math.min(pcm.length - i, 320);
      feed(pcm.slice(i, i + n), 16000);
      i += n;
      setTimeout(tick, 20);
    };
    tick();
  }

  btnRec.onclick = () => (recording ? stop() : start());
  $('btnStop').onclick = () => stop();
  $('btnClear').onclick = () => clearAll();
  $('btnFile').onclick = () => $('file').click();
  $('file').onchange = (e) => { if (e.target.files[0]) playFile(e.target.files[0]); };
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      recording ? stop() : start();
    }
  });
  addEventListener('resize', () => { dpr = Math.min(devicePixelRatio || 1, 2); fit(wave, 132); fit(spark, 56); drawWave(); drawSpark(); });

  fit(wave, 132); fit(spark, 56);
  drawWave(); updatePct(); health();
})();
</script>
