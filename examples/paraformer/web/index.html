<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Paraformer realtime 测试台</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #10141a; color: #e6edf3; }
  header { padding: 14px 20px; border-bottom: 1px solid #222c38; display: flex; gap: 16px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #1f2937; color: #9fb3c8; }
  .pill.on { background: #14432a; color: #67e8a0; }
  .pill.rec { background: #4a1717; color: #ff9a9a; }
  main { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(280px,1fr); gap: 16px; padding: 16px 20px; }
  canvas { width: 100%; height: 180px; display: block; background: #0b0f14; border: 1px solid #222c38; border-radius: 10px; }
  .meter { height: 12px; background: #0b0f14; border: 1px solid #222c38; border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .meter > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#2dd4bf,#f472b6); transition: width .06s linear; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  button { background: #1f2937; color: #e6edf3; border: 1px solid #2f3d4d; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:hover { background: #26323f; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #2563eb; border-color: #3b82f6; }
  button.danger { background: #7f1d1d; border-color: #b91c1c; }
  section { background: #131a22; border: 1px solid #222c38; border-radius: 10px; padding: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8aa0b6; margin: 0 0 10px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: #8aa0b6; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  #transcript { min-height: 56px; font-size: 18px; }
  #partials { color: #7dd3fc; min-height: 22px; }
  #log { font: 12px/1.45 ui-monospace, Menlo, monospace; color: #93a4b8; max-height: 170px; overflow: auto; white-space: pre-wrap; }
  .hint { color: #6b7f95; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Paraformer realtime 测试台</h1>
  <span id="conn" class="pill">未连接</span>
  <span id="lang" class="pill">lang: -</span>
  <span class="hint">麦克风或 wav 文件 → 20 ms 分片 → <code>/v1/realtime</code></span>
</header>

<main>
  <div>
    <canvas id="wave"></canvas>
    <div class="meter"><i id="level"></i></div>
    <div class="row">
      <button id="btnRec" class="primary">开始录音</button>
      <button id="btnStop" disabled>停止并提交</button>
      <button id="btnClear" class="danger" disabled>清空</button>
      <input id="file" type="file" accept="audio/wav" style="display:none">
      <button id="btnFile">用 wav 文件回放</button>
      <span id="fileHint" class="hint"></span>
    </div>
    <section style="margin-top:14px">
      <h2>识别结果</h2>
      <div id="transcript">—</div>
      <div id="partials"></div>
    </section>
  </div>

  <div>
    <section>
      <h2>指标</h2>
      <dl>
        <dt>已发音频</dt><dd id="mBytes">0.00 s</dd>
        <dt>endpoint→final</dt><dd id="mE2E">—</dd>
        <dt>服务端排队</dt><dd id="mQueue">—</dd>
        <dt>服务端推理</dt><dd id="mInfer">—</dd>
        <dt>服务端语言</dt><dd id="mLang">—</dd>
        <dt>分段数</dt><dd id="mSegs">0</dd>
        <dt>历史 p50 / p95</dt><dd id="mPct">—</dd>
        <dt>近 8 段</dt><dd id="mSpark" style="font-family:ui-monospace,monospace">—</dd>
      </dl>
    </section>
    <section style="margin-top:14px">
      <h2>事件</h2>
      <div id="log"></div>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $('wave');
  const ctx2d = canvas.getContext('2d');
  const connPill = $('conn'), langPill = $('lang');
  let ws = null, audioCtx = null, node = null, media = null;
  let sendRate = 16000;
  let pending = [], sentSamples = 0, recording = false;
  let endpointAt = 0, committed = 0, segments = 0;
  let lastPartial = '';
  const history = [];
  const trace = new Array(320).fill(0);   // scrolling waveform, one point per ~5 ms

  function log(msg) {
    const el = $('log');
    const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
    el.textContent = '[' + t + '] ' + msg + '\n' + el.textContent;
    if (el.textContent.length > 6000) el.textContent = el.textContent.slice(0, 6000);
  }

  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx2d.clearRect(0, 0, w, h);
    ctx2d.strokeStyle = '#1b2531';
    ctx2d.beginPath(); ctx2d.moveTo(0, h/2); ctx2d.lineTo(w, h/2); ctx2d.stroke();
    ctx2d.beginPath();
    for (let i = 0; i < trace.length; i++) {
      const x = (i / (trace.length - 1)) * w;
      const y = h/2 - trace[i] * (h/2 - 6);
      i ? ctx2d.lineTo(x, y) : ctx2d.moveTo(x, y);
    }
    ctx2d.strokeStyle = recording ? '#2dd4bf' : '#3f5163';
    ctx2d.lineWidth = 1.5;
    ctx2d.stroke();
  }
  function pushLevel(v) {
    trace.push(Math.max(-1, Math.min(1, v)));
    trace.shift();
    $('level').style.width = Math.min(100, Math.abs(v) * 180).toFixed(0) + '%';
    draw();
  }
  requestAnimationFrame(function loop() { draw(); requestAnimationFrame(loop); });

  function setConn(state, text) {
    connPill.className = 'pill ' + state;
    connPill.textContent = text;
  }

  function connect() {
    if (ws && ws.readyState <= 1) return Promise.resolve();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = proto + '//' + location.host + '/v1/realtime';
    return new Promise((resolve, reject) => {
      ws = new WebSocket(url);
      ws.onopen = () => { setConn('on', '已连接'); log('WS 已连接 ' + url); resolve(); };
      ws.onerror = () => { setConn('', '连接失败'); log('WS 连接失败'); reject(new Error('ws')); };
      ws.onclose = () => { setConn('', '未连接'); log('WS 关闭'); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        switch (m.type) {
          case 'session.created':
          case 'session.updated':
            break;
          case 'conversation.item.input_audio_transcription.delta':
            lastPartial += m.delta;
            $('partials').textContent = lastPartial;
            log('delta: ' + m.delta);
            break;
          case 'input_audio_buffer.committed':
            log('committed ' + m.item_id);
            break;
          case 'conversation.item.input_audio_transcription.completed': {
            const e2e = committed ? Math.round(performance.now() - committed) : 0;
            $('transcript').textContent = m.transcript || '(空)';
            $('partials').textContent = '';
            $('mE2E').textContent = e2e + ' ms';
            segments += 1;
            $('mSegs').textContent = segments;
            if (e2e) {
              history.push(e2e);
              const sorted = history.slice().sort((a, b) => a - b);
              const pct = (q) => sorted[Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * q))];
              $('mPct').textContent = pct(0.5) + ' / ' + pct(0.95) + ' ms (n=' + sorted.length + ')';
              $('mSpark').textContent = history.slice(-8).join(' ');
            }
            log('completed (' + e2e + ' ms): ' + m.transcript);
            committed = 0;
            lastPartial = '';
            break;
          }
          case 'x.pf.metrics':
            $('mQueue').textContent = Math.round(m.queue_ms) + ' ms';
            $('mInfer').textContent = Math.round(m.infer_ms) + ' ms';
            break;
          case 'error':
            log('error: ' + JSON.stringify(m.error));
            break;
          default:
            log(m.type);
        }
      };
    });
  }

  function sendChunk(int16) {
    if (!ws || ws.readyState !== 1) return;
    const bytes = new Uint8Array(int16.buffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    ws.send(JSON.stringify({ type: 'input_audio_buffer.append', audio: btoa(bin) }));
    sentSamples += int16.length;
    $('mBytes').textContent = (sentSamples / 16000).toFixed(2) + ' s';
  }

  // 20 ms = 320 samples at 16 kHz
  function feed(samples, srcRate) {
    if (srcRate !== sendRate) {
      const ratio = srcRate / sendRate;
      const out = new Int16Array(Math.floor(samples.length / ratio));
      for (let i = 0; i < out.length; i++) {
        const p = i * ratio, i0 = Math.floor(p), i1 = Math.min(i0 + 1, samples.length - 1);
        out[i] = samples[i0] + (samples[i1] - samples[i0]) * (p - i0);
      }
      samples = out;
    }
    for (let i = 0; i < samples.length; i++) pending.push(samples[i]);
    while (pending.length >= 320) {
      const chunk = Int16Array.from(pending.slice(0, 320));
      pending = pending.slice(320);
      let rms = 0;
      for (let i = 0; i < chunk.length; i++) rms += chunk[i] * chunk[i];
      pushLevel(Math.sqrt(rms / chunk.length) / 32768 * 3);
      sendChunk(chunk);
    }
  }

  async function startMic() {
    await connect();
    media = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(media);
    node = audioCtx.createScriptProcessor(1024, 1, 1);
    node.onaudioprocess = (ev) => {
      if (!recording) return;
      const f = ev.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f.length);
      for (let i = 0; i < f.length; i++) i16[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
      feed(i16, audioCtx.sampleRate);
    };
    src.connect(node);
    node.connect(audioCtx.destination);
    recording = true;
    $('btnRec').disabled = true;
    $('btnStop').disabled = false;
    $('btnClear').disabled = false;
    setConn('rec', '录音中');
    log('开始录音，源采样率 ' + audioCtx.sampleRate + ' Hz');
  }

  async function stopAndCommit() {
    recording = false;
    $('btnRec').disabled = false;
    $('btnStop').disabled = true;
    if (node) { node.disconnect(); node = null; }
    if (media) { media.getTracks().forEach(t => t.stop()); media = null; }
    if (audioCtx) { await audioCtx.close(); audioCtx = null; }
    if (pending.length) { feed(new Int16Array(pending), sendRate); }
    if (ws && ws.readyState === 1) {
      committed = performance.now();
      ws.send(JSON.stringify({ type: 'input_audio_buffer.commit' }));
      setConn('on', '等待结果');
      log('commit，已发 ' + (sentSamples / 16000).toFixed(2) + ' s');
    }
  }

  async function clearAll() {
    recording = false;
    pending = []; sentSamples = 0; lastPartial = '';
    history.length = 0;
    $('mPct').textContent = '—';
    $('mSpark').textContent = '—';
    $('mBytes').textContent = '0.00 s';
    $('partials').textContent = '';
    $('transcript').textContent = '—';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'input_audio_buffer.clear' }));
    setConn('on', '已清空');
  }

  async function playFile(file) {
    await connect();
    const buf = await file.arrayBuffer();
    const audio = await new AudioContext().decodeAudioData(buf);
    const i16 = new Int16Array(audio.length);
    const ch = audio.getChannelData(0);
    for (let i = 0; i < ch.length; i++) i16[i] = Math.max(-1, Math.min(1, ch[i])) * 32767;
    recording = true;
    setConn('rec', '回放中');
    $('fileHint').textContent = file.name + ' · ' + (audio.length / audio.sampleRate).toFixed(2) + ' s';
    let i = 0;
    const step = 320;   // 20 ms at 16 kHz after resampling
    const tick = () => {
      if (!recording) return;
      if (i >= i16.length) { recording = false; setConn('on', '等待结果'); commitFile(); return; }
      const n = Math.min(i16.length - i, Math.floor(step * (audio.sampleRate / 16000)));
      feed(i16.slice(i, i + n), audio.sampleRate);
      i += n;
      setTimeout(tick, 20);
    };
    tick();
  }

  function commitFile() {
    if (pending.length) feed(new Int16Array(pending), sendRate);
    committed = performance.now();
    ws.send(JSON.stringify({ type: 'input_audio_buffer.commit' }));
    log('文件回放结束，commit');
  }

  $('btnRec').onclick = () => startMic().catch(e => log('麦克风失败: ' + e.message));
  $('btnStop').onclick = () => stopAndCommit();
  $('btnClear').onclick = () => clearAll();
  $('btnFile').onclick = () => $('file').click();
  $('file').onchange = (e) => { if (e.target.files[0]) playFile(e.target.files[0]); };
})();
</script>
</body>
</html>
