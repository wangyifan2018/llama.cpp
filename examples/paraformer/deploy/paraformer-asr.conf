# Configuration for the Paraformer ASR service, read by /vendor/bin/paraformer-asr.
#
# This file is sourced by a POSIX shell. Keep it to variable assignments.
# Everything here is a path or a flag the image owns; nothing is user input.
#
# Paths below assume the layout produced by tools/package_device.sh:
#
#   /vendor/bin/paraformer-asr              this launcher
#   /vendor/lib64/paraformer/              ggml, DSP skeleton and CPU dependencies
#   /vendor/etc/paraformer/paraformer-zh-q8_0.gguf
#   /vendor/etc/paraformer/hotwords_vehicle.txt
#   /vendor/etc/paraformer/web/             test console, optional
#   /data/vendor/paraformer/                writable state and logs, created by the launcher

# ---- required --------------------------------------------------------------

PF_BIN=/vendor/bin/llama-paraformer-api
PF_MODEL=/vendor/etc/paraformer/paraformer-zh-q8_0.gguf
# One directory holding every .so above. The launcher exports both
# LD_LIBRARY_PATH and ADSP_LIBRARY_PATH from this single value.
PF_LIBDIR=/vendor/lib64/paraformer

# ---- transport -------------------------------------------------------------

# 127.0.0.1 keeps the service on the car's own loopback. A head unit app talks
# to it there. Use 0.0.0.0 only with a token set, and only if something off the
# device has to reach it: the server warns at startup when it is exposed without
# one.
PF_BIND=127.0.0.1
PF_PORT=8080

# ---- engines ---------------------------------------------------------------

# One HTP worker plus one CPU worker. Short cabin commands and long dictation
# interfere less this way than with either worker alone, and the second engine
# keeps the service answering if the DSP faults.
PF_ENGINES=2
# HTP is the shipped backend; the service exits 3 when no HTP engine comes up
# unless --allow-cpu-only is passed. "auto" keeps the binary's probe.
PF_DEVICE=HTP0:0
# HTP first, CPU as overflow: with the shared queue a single stream alternates
# backends and every other result comes from the slower worker.
PF_PREFER_IDLE_HTP=1
# Four threads, not two: the host side of a request (fbank, CIF, logits readback)
# is thread parallel. On SM6650 two threads measured 312 ms per request and four
# measured 277 ms, with the same two engines.
PF_THREADS=4

# Model name reported by /v1/models and echoed in responses.
PF_MODEL_ID=paraformer-zh-q8_0

# ---- optional paths --------------------------------------------------------
# Each one is skipped when the file is absent. A missing optional path must not
# keep the service down.

# A real speech clip, 1-2 s. Covers HTP session setup and the first graph
# allocation, which is about 1.2 s on SM6650. Without it the first real request
# pays that cost. The server falls back to silence if the file is unreadable.
PF_WARMUP=/vendor/etc/paraformer/warmup.wav

# Vehicle command bias profile. Only the zh checkpoint accepts this file: the
# word-marker convention differs per checkpoint and a profile from the other one
# silently does nothing.
PF_HOTWORDS=/vendor/etc/paraformer/hotwords_vehicle.txt

# Optional phrase bias for Realtime experiments. Pair with a measured logit gap.
# PF_CONTEXT=/vendor/etc/paraformer/context_vehicle.txt
# PF_CONTEXT_MAX_LOGIT_GAP=4

# Post-hoc literal phrase rewrites, applied to the final transcript.
PF_TEXT_RULES=/vendor/etc/paraformer/cabin_text_rules.tsv

# Test console served at /. Omit it in production images: it is a diagnostic
# page, not a product surface. The OpenAI endpoints do not need it.
# PF_WEB_DIR=/vendor/etc/paraformer/web

# Speaker gate. Off unless both the model and a populated enrollment directory
# are present. Advisory only at present; see PRODUCTION.md.
# PF_SPEAKER_MODEL=/vendor/etc/paraformer/spk_od.onnx
# PF_ENROLL_DIR=/data/vendor/paraformer/pf-enroll

# Silero VAD for long-form segmentation.
PF_VAD_MODEL=/vendor/etc/paraformer/silero_vad.onnx

# ---- credentials -----------------------------------------------------------

# Read the token from a 0600 root-owned file rather than from this config, so a
# file mode mistake in a world-readable etc directory cannot leak it. The
# launcher exports it; the server never takes a token on argv, because argv is
# world-readable through /proc.
# PF_API_KEY_FILE=/vendor/etc/paraformer/api-key

# ---- tuning ----------------------------------------------------------------

# Consecutive fast failures before the launcher starts backing off, and the
# ceiling on that wait. A failed HTP init is cheap to retry once; retrying it in
# a tight loop re-runs DSP discovery and graph compilation forever.
PF_FAST_FAIL_SECONDS=60
PF_MAX_BACKOFF_SECONDS=60

# Extra flags passed through unquoted on purpose. Set the watchdog from the
# slowest single inference at the audio length actually deployed, not from the
# warmup figure:
#   PF_EXTRA_ARGS="--htp-watchdog-ms 4000 --queue 64 --queue-mib 8 --deadline-ms 30000"
# PF_EXTRA_ARGS=
