# Configuration for a non-root test device.
#
# The production layout lives in /vendor (see paraformer-asr.conf and
# tools/package_device.sh). Without root there is no /vendor/etc/init, so the
# same launcher runs out of /data/local/tmp and a supervisor loop keeps it alive.
#
# Install this with tools/install_local.sh; it copies the tree to
# /data/local/tmp/llama.cpp and starts the launcher under setsid.

PF_BIN=/data/local/tmp/llama.cpp/bin/llama-paraformer-api
PF_MODEL=/data/local/tmp/llama.cpp/paraformer-zh-q8_0.gguf
PF_LIBDIR=/data/local/tmp/llama.cpp/lib
# sherpa-onnx and onnxruntime live in a separate directory on this layout
PF_LIBDIR_EXTRA=/data/local/tmp/llama.cpp/onnx/bin
PF_WORKDIR=/data/local/tmp/llama.cpp/state
PF_LOG=/data/local/tmp/llama.cpp/state/paraformer-asr.log

PF_PORT=8899
# Loopback: reachable through adb forward, not from the network. Set a
# PF_API_KEY before widening this.
PF_BIND=127.0.0.1
PF_ENGINES=2
# HTP is the shipped backend and the service refuses to start without one; the
# CPU worker is overflow for a second concurrent request. "auto" keeps the
# binary's probe (useful on a host).
PF_DEVICE=HTP0:0
PF_PREFER_IDLE_HTP=1
# Four cabin streams plus the console and a probe.
PF_MAX_WS_SESSIONS=8
# Four threads, not two: the host side of every request (fbank, CIF, logits
# readback) is thread parallel, and two threads measured 312 ms against 277 ms.
PF_THREADS=4

# Optional capabilities. Each one costs memory, and this device already runs a
# second HTP client, so they are off unless a test needs them.
PF_VAD_MODEL=/data/local/tmp/llama.cpp/onnx/model/silero_vad.onnx
# Speaker scoring is off by default: a wrong voiceprint rejects the driver, and the
# decision belongs to the product layer, not to the ASR service. Read
# docs/backend/snapdragon/api-reference.md section 7 before enabling it.
PF_SPEAKER_MODEL=
PF_ENROLL_DIR=
PF_VOICEPRINT_FILE=
PF_WEB_DIR=/data/local/tmp/llama.cpp/web

PF_WARMUP=/data/local/tmp/llama.cpp/pf-api-warm.wav

# The accuracy profile is part of the service, not an optional extra: without it
# the cabin command field drops from about 72% to 56% on the shipped clip set.
PF_HOTWORDS=/data/local/tmp/llama.cpp/hotwords_vehicle.txt
PF_TEXT_RULES=/data/local/tmp/llama.cpp/cabin_text_rules.tsv
